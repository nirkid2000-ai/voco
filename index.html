<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <div class="feedbackbg">
        <div class="questions">
          <!-- <div class="q_label">מה פירוש המילה?</div> -->
          <div class="word_level">
            <div class="word_status">מילה חדשה</div>
            <div class="word_scale"></div>
          </div>
          <div class="q">שאלה</div>
          <div class="q_stat">
            <div class="diff">
              <div class="word_difficulty">רמת קושי:</div>
              <div class="bar">
                <div class="arrow">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 36.45 27"
                  >
                    <polyline points="0 26.64 18.05 0 36.45 27" />
                  </svg>
                </div>
              </div>
            </div>
            <div class="mastery">
              <div class="word_difficulty">רמת שליטה:</div>
              <div class="stars">
                <div class="star-meter" data-rating="3.6">
                  <svg viewBox="0 0 120 24" class="stars">
                    <!-- empty stars -->
                    <g class="stars-bg">
                      <polygon
                        points="12,1 15,8 23,9 17,14 18,22 12,18 6,22 7,14 1,9 9,8"
                      />
                      <polygon
                        points="36,1 39,8 47,9 41,14 42,22 36,18 30,22 31,14 25,9 33,8"
                      />
                      <polygon
                        points="60,1 63,8 71,9 65,14 66,22 60,18 54,22 55,14 49,9 57,8"
                      />
                      <polygon
                        points="84,1 87,8 95,9 89,14 90,22 84,18 78,22 79,14 73,9 81,8"
                      />
                      <polygon
                        points="108,1 111,8 119,9 113,14 114,22 108,18 102,22 103,14 97,9 105,8"
                      />
                    </g>

                    <!-- filled stars -->
                    <g class="stars-fill">
                      <polygon
                        points="12,1 15,8 23,9 17,14 18,22 12,18 6,22 7,14 1,9 9,8"
                      />
                      <polygon
                        points="36,1 39,8 47,9 41,14 42,22 36,18 30,22 31,14 25,9 33,8"
                      />
                      <polygon
                        points="60,1 63,8 71,9 65,14 66,22 60,18 54,22 55,14 49,9 57,8"
                      />
                      <polygon
                        points="84,1 87,8 95,9 89,14 90,22 84,18 78,22 79,14 73,9 81,8"
                      />
                      <polygon
                        points="108,1 111,8 119,9 113,14 114,22 108,18 102,22 103,14 97,9 105,8"
                      />
                    </g>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="answers_ui">
          <div class="wordlist"></div>
          <div class="countdown_con">
            <div class="countdown_bg"></div>
            <div class="countdown"></div>
          </div>

          <div class="feedback">
            <label></label>
          </div>
          <div class="btns">
            <button class="submit main_ans inactive" data-mode="main">
              בחר תשובה
            </button>
            <div class="knoworguess hidden">
              <button class="submit know_ans first" data-mode="know">
                אני יודע
              </button>
              <button class="submit guess_ans first" data-mode="guess">
                אני מנחש
              </button>
            </div>
          </div>

          <button class="next_btn">דלג שאלה</button>
        </div>
      </div>

      <div class="timer">
        <label>זמן שעבר:<span class="time_stat">00:00</span> </label>
      </div>
      <div class="streak">
        <label>רצף תשובות נכונות:<span class="streak_stat">0</span> </label>
      </div>
      <div class="total_stat">
        <label>סה״כ תשובות נכונות:<span class="total_from">0</span> </label>
      </div>
      <div class="score">
        <label>ניקוד:<span class="score_stat">0</span> </label>
      </div>
      <button class="reset">reset</button>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
