<html lang="en">

            </div>
          </div>

          <div class="answers_ui">
            <div class="wordlist"></div>
            <div class="blind_recall">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 268.62 162.96"
              >
                <path
                  class="blind_logo"
                  d="M156.04,42.97l-59.13,59.07c-9.64-16.55-7.33-38.12,6.85-52.28,14.18-14.16,35.75-16.43,52.28-6.79Z"
                />

                  class="blind_logo"
                  d="M171.7,58.65c9.64,16.55,7.33,38.12-6.85,52.3-14.19,14.16-35.76,16.43-52.3,6.77l59.14-59.07Z"
                />
                <path
                  class="blind_logo"
                  d="M130.05,0C55.64,0,0,81.2,0,81.2c0,0,41.82,81.77,138.36,81.77,70.41,0,130.26-82.34,130.26-82.34,0,0-54.53-80.62-138.56-80.62ZM178.59,124.7c-24.5,24.45-64.17,24.44-88.63-.06-24.47-24.5-24.44-64.18.06-88.63,24.5-24.47,64.17-24.44,88.63.06,24.47,24.48,24.44,64.17-.06,88.63Z"
                />
              </svg>
              <div class="blind_text">Blind Recall</div>
            </div>
            <div class="countdown_con">
              <div class="countdown_bg"></div>
              <div class="countdown"></div>
            </div>

            <div class="feedback">
              <label></label>
            </div>
            <div class="btns">
              <button class="submit main_ans inactive" data-mode="main">
                בחר תשובה
              </button>
              <div class="knoworguess hidden">
                <button class="submit know_ans first" data-mode="know">
                  אני יודע
                </button>
                <button class="submit guess_ans first" data-mode="guess">
                  אני מנחש
                </button>
              </div>
            </div>

            <button class="next_btn">דלג שאלה</button>
          </div>
          <div class="timer">
            <label>זמן שאלה:<span class="q_timer">00:00</span> </label>
            <label>זמן תרגול:<span class="set_timer">00:00</span> </label>
          </div>

          <div class="fb_grid"></div>
          <button class="reset">reset</button>
        </div>
      </div>

      <div class="text_stats">
        <div class="streak">
          <label>רצף תשובות נכונות:<span class="streak_stat">0</span> </label>
        </div>
        <div class="total_stat">
          <label>סה״כ תשובות נכונות:<span class="total_from">0</span> </label>
        </div>
        <div class="score">
          <label>ניקוד:<span class="score_stat">0</span> </label>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
